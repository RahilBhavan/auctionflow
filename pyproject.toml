[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auctionflow-oneshot"
version = "0.1.0"
description = "Deterministic, offline, alert-only MES research replay"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3", "pyarrow>=15,<23"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "hypothesis>=6,<7"]
dev = ["ruff>=0.6,<1"]

[project.scripts]
auctionflow = "auctionflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
